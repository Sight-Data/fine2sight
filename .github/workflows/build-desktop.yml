name: Build desktop app

# 用 GitHub 托管的 Windows / macOS runner 原生打包桌面应用,替代自建远程构建机
# (原先靠 SSH 远程到内网构建机打包,现在换成公开、无需自建机器的方案)。
# PyInstaller 本身不能交叉编译,但 GitHub Actions 免费提供真机 windows-latest /
# macos-latest,天然解决"从一台机器出多平台包"的问题,开源场景下无需再自建构建机。
#
# 触发方式:
#   - 打 tag(v*)自动构建并把产物挂到该 tag 对应的 GitHub Release
#   - 也可在 Actions 页手动 "Run workflow"(workflow_dispatch),仅产出构建产物(不建 Release)
#
# 版本号:构建不自动递增 version.py(FR_NO_BUMP=1),以仓库里 version.py 的
# __version__ 为准(想发新版本先在源码里改好 __version__ 再打 tag)。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # 打 tag 触发时需要能创建 Release 并上传产物

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    env:
      FR_NO_BUMP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 打包 .exe(直接复用 desktop/build-windows.bat)
        working-directory: desktop
        run: build-windows.bat

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      FR_NO_BUMP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 打包 .app(直接复用 desktop/build-mac.sh)
        working-directory: desktop
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: 压缩 .app(Release 附件用,便于下载)
        working-directory: desktop/dist
        run: ditto -c -k --sequesterRsrc --keepParent "帆软报表转换器.app" "帆软报表转换器-mac.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: desktop/dist/*.zip
          if-no-files-found: error

  smoke-test:
    # 轻量自检:纯标准库的 convert.py CLI 在 Linux 上能正常 import/运行(无需 GUI 依赖)。
    # 仓库里没有可公开的 .cpt 样例数据,所以这里不跑 desktop/test_core.py 的完整回归,
    # 只做"能跑起来"级别的冒烟检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 convert.py --help

  release:
    needs: [windows, macos, smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 / 更新 Release 并挂上产物
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
